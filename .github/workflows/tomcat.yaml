name: CI/CD pipeline to Deploy to Tomcat

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST: ${{ secrets.SONAR_HOST }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
      TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
      TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Configure Maven settings.xml with Nexus credentials
      - name: Configure Maven settings
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 4️⃣ Maven Validate
      - name: Maven validate
        run: mvn validate -Dproject.build.sourceEncoding=UTF-8

      # 5️⃣ Maven Compile
      - name: Maven compile
        run: mvn compile -Dproject.build.sourceEncoding=UTF-8

      # 6️⃣ Maven Test
      - name: Maven test
        run: mvn test -Dproject.build.sourceEncoding=UTF-8

      # 7️⃣ SonarQube Code Quality
      - name: Sonar Code Quality
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${SONAR_HOST} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dproject.build.sourceEncoding=UTF-8

      # 8️⃣ Maven Package
      - name: Maven package
        run: mvn package -DskipTests -Dproject.build.sourceEncoding=UTF-8

      # 9️⃣ Upload Artifact to Nexus
      - name: Upload Artifact to Nexus
        run: |
          mvn deploy -DskipTests -Dproject.build.sourceEncoding=UTF-8

      # 🔟 Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        run: |
          curl -v -u ${TOMCAT_USER}:${TOMCAT_PASSWORD} \
            -T target/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${TOMCAT_HOST}:8080/manager/text/deploy?path=/vcube140&update=true"
