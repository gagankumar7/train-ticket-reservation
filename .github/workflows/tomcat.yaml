name: CI/CD pipeline to Deploy to Tomcat

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_HOST: ${{ secrets.SONAR_HOST }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
      TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
      TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Maven settings.xml
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>central</id>
                <name>Nexus Mirror</name>
                <url>https://nexus.example.com/repository/maven-public/</url>
                <mirrorOf>*</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Maven Validate
        run: mvn validate -Dproject.build.sourceEncoding=UTF-8

      - name: Maven Compile
        run: mvn compile -Dproject.build.sourceEncoding=UTF-8

      - name: Maven Test
        run: mvn test -Dproject.build.sourceEncoding=UTF-8

      - name: Sonar Code Quality
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${SONAR_HOST} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dproject.build.sourceEncoding=UTF-8

      - name: Maven Package
        run: mvn package -DskipTests -Dproject.build.sourceEncoding=UTF-8

      - name: Upload Artifact to Nexus
        run: mvn deploy -DskipTests -Dproject.build.sourceEncoding=UTF-8

      - name: Deploy WAR to Tomcat
        run: |
          curl -v -u ${TOMCAT_USER}:${TOMCAT_PASSWORD} \
            -T target/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${TOMCAT_HOST}:8080/manager/text/deploy?path=/vcube140&update=true"
