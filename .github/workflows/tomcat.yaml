name: CI/CD Pipeline for TrainBook

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Configure Maven with settings.xml
      - name: Configure Maven for Nexus
        run: |
          mkdir -p ~/.m2
          echo "${{ secrets.MAVEN_SETTINGS }}" > ~/.m2/settings.xml

      # 4️⃣ Maven validate
      - name: Maven validate
        run: mvn validate

      # 5️⃣ Maven compile
      - name: Maven compile
        run: mvn compile

      # 6️⃣ Maven test
      - name: Maven test
        run: mvn test

      # 7️⃣ SonarQube analysis
      - name: SonarQube Code Quality
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 8️⃣ Maven deploy to Nexus
      - name: Deploy Artifact to Nexus
        run: |
          # Detect if version is SNAPSHOT or RELEASE
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"

          if [[ "$VERSION" == *"SNAPSHOT"* ]]; then
            echo "Deploying to Nexus SNAPSHOT repository"
            mvn clean deploy -DskipTests=true -DaltDeploymentRepository=nexus-snapshots::default::${{ secrets.NEXUS_URL_SNAPSHOTS }}
          else
            echo "Deploying to Nexus RELEASE repository"
            mvn clean deploy -DskipTests=true -DaltDeploymentRepository=nexus-releases::default::${{ secrets.NEXUS_URL_RELEASES }}
          fi

      # 9️⃣ Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          curl -v -u ${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }} \
            -T target/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/vcube140&update=true"
