name: CI/CD Pipeline for TrainBook

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Configure Maven with settings.xml for Nexus
      - name: Configure Maven for Nexus
        run: |
          mkdir -p ~/.m2
          printf "%s\n" "${{ secrets.MAVEN_SETTINGS }}" > ~/.m2/settings.xml

      # 4️⃣ Maven Build & Package
      - name: Maven Build & Package
        run: mvn clean package -DskipTests=true

      # 5️⃣ SonarQube Analysis
      - name: SonarQube Code Quality
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 6️⃣ Deploy Arti
