name: CI/CD Pipeline for TrainBook

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Configure Maven with settings.xml (fixed multi-line secret issue)
      - name: Configure Maven for Nexus
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          ${{ secrets.MAVEN_SETTINGS }}
          EOF

      # 4️⃣ Maven build (clean, compile, test, package)
      - name: Maven Build & Package
        run: mvn clean package -DskipTests=true

      # 5️⃣ SonarQube Analysis
      - name: SonarQube Code Quality
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 6️⃣ Deploy Artifact to Nexus (detect SNAPSHOT vs RELEASE)
      - name: Deploy Artifact to Nexus
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"

          if [[ "$VERSION" == *"SNAPSHOT"* ]]; then
            echo "Deploying to Nexus SNAPSHOT repository"
            mvn deploy -DskipTests=true \
              -DaltDeploymentRepository=nexus-snapshots::default::${{ secrets.NEXUS_URL_SNAPSHOTS }}
          else
            echo "Deploying to Nexus RELEASE repository"
            mvn deploy -DskipTests=true \
              -DaltDeploymentRepository=nexus-releases::default::${{ secrets.NEXUS_URL_RELEASES }}
          fi

      # 7️⃣ Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE="target/TrainBook-$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout).war"
          echo "Deploying $WAR_FILE to Tomcat"
          curl -v -u ${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }} \
            -T "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/vcube140&update=true"
