name: CI/CD pipeline to Deploy to Tomcat

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Maven Validate
      - name: Maven validate
        run: mvn validate -Dproject.build.sourceEncoding=UTF-8

      # 4️⃣ Maven Compile
      - name: Maven compile
        run: mvn compile -Dproject.build.sourceEncoding=UTF-8

      # 5️⃣ Maven Test
      - name: Maven test
        run: mvn test -Dproject.build.sourceEncoding=UTF-8

      # 6️⃣ SonarQube Code Quality
      - name: Sonar Code Quality
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=train-ticket \
            -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dproject.build.sourceEncoding=UTF-8

      # 7️⃣ Maven Package
      - name: Maven package
        run: mvn package -DskipTests -Dproject.build.sourceEncoding=UTF-8

      # 8️⃣ Upload Artifact to Nexus (correct syntax)
      - name: Upload Artifact to Nexus
        run: |
          mvn deploy \
            -DskipTests \
            -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_URL }} \
            -Dnexus.username=${{ secrets.NEXUS_USERNAME }} \
            -Dnexus.password=${{ secrets.NEXUS_PASSWORD }} \
            -Dproject.build.sourceEncoding=UTF-8

      # 9️⃣ Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        run: |
          curl -v -u ${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }} \
            -T target/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/vcube140&update=true"
